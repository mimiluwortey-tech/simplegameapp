<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guess The Number</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-blue-900 to-blue-700 flex items-center justify-center px-4">
<div class="w-full max-w-md bg-white/10 rounded-2xl p-8 text-center text-white">
    <h1 class="text-3xl font-bold">Guess The Number!</h1>
    <p class="mt-4">I'm thinking of a number between 1-20</p>
    <p id="result" class="mt-4 text-lg">Make your guess!</p>

    <div class="mt-6 flex justify-center gap-3">
        <input name="number" id="numberInput" placeholder="Enter your guess" class="w-40 rounded-lg px-4 py-2 text-gray-900">
                <button onclick="compareNumber()" class="bg-green-600 hover:bg-green-700 text-white px-5 py-2 rounded-lg">Submit Guess</button>
    </div>

    <p class="mt-6">Attempts: <span id="attempts">0</span></p>
        <button id="new-game-button" class="mt-6 bg-red-500 hover:bg-red-600 text-white px-5 py-2 rounded-lg">New Game</button>
</div>
<script type="text/javascript" src="simplegame.js"></script>
</body>
</html>
